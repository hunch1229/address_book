{# 없는 주소나 없는 연락처에 접근했을 때 보여 주는 화면 (HTTP 404) #}
{% extends "base.html" %}

{% block title %}페이지를 찾을 수 없음{% endblock %}

{% block content %}
  <h2>페이지를 찾을 수 없습니다 (404)</h2>
  <p>요청한 연락처가 없거나 이미 삭제되었습니다.</p>
  <p><a href="{{ url_for('index') }}" class="btn btn-primary">목록으로 돌아가기</a></p>
{% endblock %}
